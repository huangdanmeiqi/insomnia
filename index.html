<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>失眠夜行</title>
<style>
/* 版面：完全按「网页尺寸大小.ai」1920×1080 画布摆放，整体等比缩放到窗口大小 */
:root {
  --blue: #0073C1;
  --red: #E35E40;
  --teal: #009B8A;
  --yellow: #F0D600;
  --panel: #E5E5E5;
  --paper: #FFFFFF;
  --ink: #000000;
  --light: #F1F1F1;
  --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); overflow: hidden; font-family: var(--font); font-weight: 700; }

#viewport { position: fixed; inset: 0; display: grid; place-items: center; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; background: var(--paper); }
.abs { position: absolute; }
.t { position: absolute; line-height: 1; white-space: nowrap; }

#board { left: 150px; top: 45px; width: 990px; height: 990px; display: block; user-select: none; -webkit-user-drag: none; }

/* MY TURN 按钮 */
#turn { left: 1278.7px; top: 56.5px; width: 472.9px; height: 141.8px; border-radius: 27.2px; border: 0; padding: 0;
  background: var(--blue); color: var(--light); cursor: pointer; font: inherit; transition: background-color .25s, transform .12s; }
#turn:hover { filter: brightness(1.05); }
#turn:active { transform: scale(.985); }
#turn:disabled { cursor: default; filter: none; transform: none; }
#turn:focus-visible { outline: 4px solid var(--ink); outline-offset: 4px; }
#turnLabel { left: 69.5px; top: 60.6px; font-size: 24.5px; }
#digit { right: 147px; top: 42px; font-size: 70.3px; }   /* 右边缘对齐 x=1604.7 */
#pips { left: 342.2px; top: 47.1px; width: 30.4px; height: 48.6px; }
#pips i { position: absolute; width: 11.3px; height: 11.3px; background: currentColor; }
#pips i.sp { background: var(--sp, var(--red)); }

/* 分数面板 */
#scores { left: 1278.7px; top: 235.9px; width: 472.9px; height: 403.3px; border-radius: 27.2px; background: var(--panel); }
.lbl, .num { font-size: 29.06px; }
.num { text-align: right; }

/* TIPS */
#tipsHead { left: 1278.7px; top: 708.7px; font-size: 29.06px; color: var(--ink); }
#card { left: 1273.7px; top: 753.4px; width: 482.9px; height: 261.2px; border: 10px solid var(--red); background: var(--paper); color: var(--red); }
#cardImg { left: 13.8px; top: 14.3px; width: 180.4px; height: 212.5px; object-fit: cover; display: block; }
#cardBlock { left: 13.8px; top: 14.3px; width: 180.4px; height: 212.5px; background: var(--red); }
#cardTitle { left: 212.1px; top: 15.0px; font-size: 24.51px; }
#cardDesc { left: 212.1px; top: 135.1px; width: 225px; font-size: 17.31px; line-height: 17.07px; white-space: normal; }
#cardFx { left: 213.3px; top: 211.1px; font-size: 17.31px; }

/* 棋子 */
.piece { position: absolute; width: 38px; height: 38px; margin: -19px 0 0 -19px; border-radius: 50%; border: 4px solid #fff;
  box-shadow: 0 3px 8px rgba(0,0,0,.35); display: grid; place-items: center; color: #fff; font-size: 17px;
  transition: left .2s ease, top .2s ease; z-index: 2; }
.piece.yellow { color: var(--red); }
.piece.now { z-index: 3; animation: bob 1.1s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-9px); } }
.pop { position: absolute; transform: translate(-50%, -100%); font-size: 18px; padding: 3px 9px; border-radius: 999px;
  background: var(--ink); color: #fff; z-index: 4; pointer-events: none; white-space: nowrap; animation: rise 1.3s ease-out forwards; }
@keyframes rise { from { opacity: 0; margin-top: 0; } 15% { opacity: 1; } to { opacity: 0; margin-top: -42px; } }
@media (prefers-reduced-motion: reduce) { .piece, .piece.now, .pop { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <img id="board" class="abs" src="board.jpg?v=7" alt="失眠夜行棋盘">
    <div id="pieces"></div>

    <button id="turn" class="abs" aria-label="掷骰子">
      <span id="turnLabel" class="t">MY TURN</span>
      <span id="digit" class="t">6</span>
      <span id="pips" class="abs"></span>
    </button>

    <div id="scores" class="abs"></div>
    <div id="scoreText"></div>

    <div id="tipsHead" class="t">TIPS</div>
    <div id="card" class="abs">
      <img id="cardImg" class="abs" alt="">
      <div id="cardBlock" class="abs" hidden></div>
      <div id="cardTitle" class="t"></div>
      <div id="cardDesc" class="t"></div>
      <div id="cardFx" class="t"></div>
    </div>
  </div>
</div>
<script src="board-data.js?v=7"></script>
<script src="game.js?v=7"></script>
</body>
</html>
